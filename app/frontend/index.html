<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><title>Kinbo · Gadget desk</title><link rel="stylesheet" href="./style.css"></head>
<body><header><div class="wrap top"><a href="./" class="brand"><b>K</b> Kinbo</a><button id="theme">Switch theme</button></div></header>
<main class="wrap"><section class="intro"><div><small>GADGET DESK</small><h1>Ask Kinbo<span>.</span></h1><p>Compare gadgets, check stock, and look up store policies in Bangladesh.</p></div><div class="signal" aria-hidden="true"><i></i><i></i><i></i><i></i></div></section>
<div class="grid"><section class="panel"><div class="heading"><h2>Shopping assistant</h2><small id="mode"></small></div><div id="messages" role="log" aria-live="polite"></div><div id="examples"></div><form id="chat" hidden><label for="question">Your question</label><div class="row"><input id="question" required maxlength="2000" autocomplete="off" placeholder="Ask about a gadget or policy"><button id="send">Send ↗</button></div></form></section>
<section class="panel"><div class="heading"><h2>Catalog</h2><small id="count"></small></div><label for="filter">Category</label><select id="filter"><option value="">All gadgets</option><option value="phone">Phones</option><option value="laptop">Laptops</option><option value="tablet">Tablets</option><option value="accessory">Accessories</option></select><div id="list" aria-live="polite"></div></section></div></main><script src="./app.js"></script></body></html>
